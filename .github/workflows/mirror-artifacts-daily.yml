name: Mirror Daily Artifacts

on:
  push:
    branches:
      - master
  schedule:
    - cron:  '0 2 * * *'
  workflow_dispatch:
    inputs:
      debug:
        description: "Enable debug logging"
        required: false
        type: boolean

jobs:
  mirror-artifacts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read secrets into environment
        uses: rancher-eio/read-vault-secrets@0da85151ad1f19ed7986c41587e45aac1ace74b6 # v3
        with:
          secrets: |
            secret/data/github/repo/${{ github.repository }}/dockerhub/rancher/credentials username | DOCKER_USERNAME ;
            secret/data/github/repo/${{ github.repository }}/dockerhub/rancher/credentials password | DOCKER_PASSWORD ;
            secret/data/github/repo/${{ github.repository }}/application-collection/credentials username | APPCO_USERNAME ;
            secret/data/github/repo/${{ github.repository }}/application-collection/credentials password | APPCO_PASSWORD ;
            secret/data/github/repo/${{ github.repository }}/rancher-prime-registry/credentials username | PRIME_USERNAME ;
            secret/data/github/repo/${{ github.repository }}/rancher-prime-registry/credentials password | PRIME_PASSWORD

      - name: Install regsync
        run: |
          REGSYNC_CHECKSUM=486d5fcac076e31837864632446de22519d88101db4a4b4cfaa4ee3350e41606
          curl --silent --fail --location --output regsync https://github.com/regclient/regclient/releases/download/v0.11.5/regsync-linux-amd64
          echo "${REGSYNC_CHECKSUM}  regsync" | sha256sum -c -
          chmod +x regsync

      - name: Mirror daily artifacts
        run: |
          export PATH=$PATH:$(pwd)
          if [ "${{ inputs.debug }}" = "true" ]; then
            time regsync once --logopt json --config regsync-daily.yaml --verbosity debug
          else
            time regsync once --logopt json --config regsync-daily.yaml
          fi
